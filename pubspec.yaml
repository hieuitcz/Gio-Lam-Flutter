name: gio_lam
description: "Mini app cham cong Gio-Lam bang Flutter (Windows): bam gio, nhap tay trong ngay, ca dem 20h-05h."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  crypto: ^3.0.6
  pdf: ^3.11.3
  image: 4.5.4 # image 4.11.0 khong tuong thich voi archive 4.0.9 (thieu decodeLazy)
  open_filex: ^4.5.0
  file_picker: ^8.1.0 # chon file sao lưu JSON de khoi phuc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
